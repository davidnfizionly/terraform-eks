name: Terraform CI/CD

on:
  push:
    paths:
      - 'infra/**'
  pull_request:

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::481665100297:role/TerraformDeployRole
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform -chdir=infra/live init

      - name: Terraform Validate
        run: terraform -chdir=infra/live validate

      - name: Terraform Plan
        run: terraform -chdir=infra/live plan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform -chdir=infra/live apply -auto-approve
