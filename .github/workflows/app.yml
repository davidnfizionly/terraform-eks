name: App CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'eks-demo-ui/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::481665100297:role/AppDeployRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build frontend
        run: |
          cd eks-demo-ui/frontend
          docker build -t eks-demo-frontend .
          docker tag eks-demo-frontend:latest 481665100297.dkr.ecr.us-east-1.amazonaws.com/eks-demo-frontend:latest
          docker push 481665100297.dkr.ecr.us-east-1.amazonaws.com/eks-demo-frontend:latest

      - name: Build backend
        run: |
          cd eks-demo-ui/backend
          docker build -t eks-demo-backend .
          docker tag eks-demo-backend:latest 481665100297.dkr.ecr.us-east-1.amazonaws.com/eks-demo-backend:latest
          docker push 481665100297.dkr.ecr.us-east-1.amazonaws.com/eks-demo-backend:latest

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --region us-east-1 --name terraform-eks-demo-eks
          kubectl apply -f eks-demo-ui/k8s/backend-deployment.yaml
          kubectl apply -f eks-demo-ui/k8s/frontend-deployment.yaml
          kubectl apply -f eks-demo-ui/k8s/ingress.yaml
